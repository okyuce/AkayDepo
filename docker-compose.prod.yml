version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: akaydepo_postgres_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
      POSTGRES_USER: ${DB_USER:-akaydepo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-akaydepo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - akaydepo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-akaydepo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: akaydepo_redis_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - akaydepo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akaydepo_api_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql://${DB_USER:-akaydepo}:${DB_PASSWORD}@db:5432/${DB_NAME:-akaydepo}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Zebra bulut yazdırma (Online Print) — değerler .env.prod'dan gelir
      ZEBRA_API_KEY: ${ZEBRA_API_KEY:-}
      ZEBRA_TENANT: ${ZEBRA_TENANT:-}
      ZEBRA_PRINTER_SERIAL: ${ZEBRA_PRINTER_SERIAL:-}
      ZEBRA_ENABLED_DEPOT_CODES: ${ZEBRA_ENABLED_DEPOT_CODES:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - akaydepo_network
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w 8
      -b 0.0.0.0:8001
      --timeout 180
      --graceful-timeout 30
      --max-requests 500
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8001/v1/auth/depots/public"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # React Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost/ws}
    container_name: akaydepo_web_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
    networks:
      - akaydepo_network

  # Dashboard (Yonetici Paneli)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: akaydepo_dashboard_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
    networks:
      - akaydepo_network

  # SuperAdmin Panel
  superadmin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.superadmin
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: akaydepo_superadmin_prod
    restart: always
    environment:
      TZ: Europe/Istanbul
    networks:
      - akaydepo_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: akaydepo_nginx_8005
    restart: always
    environment:
      TZ: Europe/Istanbul
    ports:
      - "80:80"
      - "443:443"
      - "8100:8100"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
      - dashboard
      - superadmin
    networks:
      - akaydepo_network

  # Auto-heal: unhealthy container'ları otomatik restart eder
  autoheal:
    image: willfarrell/autoheal
    container_name: akaydepo_autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - akaydepo_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  akaydepo_network:
    driver: bridge
